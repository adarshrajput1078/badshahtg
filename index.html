<style>

:root {
    --bg: #070707;
    --card: #0e0e0d;
    --gold: #f5c542;
    --gold-light: #ffe58a;
    --blue: #159cff;
    --white: #ffffff;
    --muted: #a69e8b;

    --gold-gradient:

            #c78a12 0%,
            #f5c542 45%,
            #ffe58a 50%,
            #f5c542 55%,
            #c78a12 100%
        );
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 5%,
            rgba(21,156,255,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 35%,
            rgba(245,197,66,.06),
            transparent 35%
        ),
        #070707;

    color: var(--white);

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    display: flex;
    justify-content: center;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 400px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 21px;
    padding-top: 25px;
}

/* ================= LOGO ================= */

.logo-container {
    width: 145px;
    height: 145px;

    border-radius: 50%;

    background: #030303;

    border: 2px solid var(--blue);

    box-shadow:
        0 0 15px rgba(21,156,255,.55),
        0 0 35px rgba(21,156,255,.25),
        0 0 65px rgba(21,156,255,.10);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* ================= BADGE ================= */

.badge {
    border: 1px solid var(--gold);

    color: var(--gold);

    padding: 8px 20px;

    border-radius: 30px;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 1px;

    display: flex;
    align-items: center;
    gap: 8px;

    background: rgba(245,197,66,.025);

    box-shadow:
        0 0 15px rgba(245,197,66,.08);
}

/* ================= TITLE ================= */

h1 {
    margin: -2px 0 0;

    font-family: Georgia, serif;

    font-size: 30px;

    letter-spacing: 1px;

    color: #fff;

    text-shadow:
        0 2px 15px rgba(245,197,66,.20);
}

.subtitle {
    margin: -5px 0 0;

    font-family: Georgia, serif;

    font-size: 16px;

    font-weight: 700;

    color: var(--gold-light);

    display: flex;
    align-items: center;
    gap: 10px;
}

.features {
    color: var(--muted);

    font-family: Georgia, serif;

    font-size: 13px;

    line-height: 1.8;

    margin-top: -5px;
}

/* ================= TELEGRAM BUTTON ================= */

.cta-button {
    position: relative;

    overflow: hidden;

    width: 100%;

    padding: 18px;

    border-radius: 32px;

    background: var(--gold-gradient);

    color: #080808;

    text-decoration: none;

    font-size: 15px;

    font-weight: 900;

    letter-spacing: .3px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    box-shadow:
        0 10px 30px rgba(245,197,66,.20),
        0 0 20px rgba(245,197,66,.08),
        inset 0 1px 0 rgba(255,255,255,.55);

    transition:
        transform .15s ease,
        opacity .2s ease;
}

.cta-button svg {
    flex-shrink: 0;
}

.cta-button::after {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 45%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    animation: shine 3s infinite;
}

@keyframes shine {

    0% {
        left: -100%;
    }

    55%,100% {
        left: 150%;
    }
}

.cta-button:active {
    transform: scale(.97);
}

/* ================= ACCESS TEXT ================= */

.instant-access {
    margin-top: -8px;

    color: var(--muted);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;
}

/* ================= STATS ================= */

.stats-box {

    width: 100%;

    padding: 20px 0;

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(245,197,66,.015)
        );

    border: 1px solid rgba(255,255,255,.10);

    border-radius: 16px;

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.015);
}

.stat-item {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    border-right:
        1px solid rgba(255,255,255,.10);
}

.stat-item:last-child {
    border-right: none;
}

.stat-value {

    color: var(--gold);

    font-family: Georgia, serif;

    font-size: 18px;

    font-weight: bold;

    text-shadow:
        0 0 12px rgba(245,197,66,.18);
}

.stat-label {

    color: var(--muted);

    font-family: Georgia, serif;

    font-size: 10px;

    letter-spacing: 1px;
}

/* ================= NOTE ================= */

.tracking-note {

    color: #625d51;

    font-size: 9px;

    line-height: 1.5;

    max-width: 330px;
}

/* ================= MOBILE ================= */

@media (max-width: 360px) {

    body {
        padding: 15px;
    }

    .container {
        padding-top: 15px;
    }

    .logo-container {
        width: 125px;
        height: 125px;
    }

    h1 {
        font-size: 27px;
    }

    .cta-button {
        font-size: 14px;
        padding: 17px;
    }
}

<script>

/*
    Meta Pixel:
    PageView = page visit
    Lead = Telegram CTA click

    Lead records the website CTA interaction.
    It does not confirm an actual Telegram join.
*/

const telegramBtn =
    document.getElementById("telegramBtn");

let leadTracked = false;
let clickLocked = false;

telegramBtn.addEventListener("click", function(event) {

    if (clickLocked) {
        event.preventDefault();
        return;
    }

    clickLocked = true;

    if (
        !leadTracked &&
        typeof fbq === "function"
    ) {

        fbq(
            "track",
            "Lead"
        );

        leadTracked = true;
    }

    telegramBtn.style.pointerEvents = "none";
    telegramBtn.style.opacity = "0.75";

    setTimeout(function() {

        clickLocked = false;

        telegramBtn.style.pointerEvents = "auto";
        telegramBtn.style.opacity = "1";

    }, 1500);

});

</script>

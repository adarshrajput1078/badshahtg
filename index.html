<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bot traffic rokne ke liye No-Index tag -->
    <meta name="robots" content="noindex, nofollow">
    
    <title>BADSHAH BHAIYA - Telegram Channel</title>
    
    <!-- Meta Pixel Code -->  
    <script>  
    !function(f,b,e,v,n,t,s)  
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?  
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};  
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';  
    n.queue=[];t=b.createElement(e);t.async=!0;  
    t.src=v;s=b.getElementsByTagName(e)[0];  
    s.parentNode.insertBefore(t,s)}(window, document,'script',  
    'https://connect.facebook.net/en_US/fbevents.js');  
    fbq('init', '2236204470286124');  
    fbq('track', 'PageView');  
    </script>  
    <noscript><img height="1" width="1" style="display:none"  
    src="https://www.facebook.com/tr?id=2236204470286124&ev=PageView&noscript=1"  
    /></noscript>  
    <!-- End Meta Pixel Code -->  

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e8e8e8;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            width: 90%;
            max-width: 380px;
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
        }

        .name {
            font-family: 'Georgia', serif;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .join-btn {
            background-color: #1765b7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            margin-bottom: 35px;
            transition: background-color 0.3s;
        }

        .join-btn:hover {
            background-color: #14559c;
        }

        .countdown-container {
            margin-bottom: 40px;
            min-height: 50px;
        }

        .timer {
            color: #d1215b;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .labels {
            color: #d1215b;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            word-spacing: 12px;
        }

        .footer {
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }

        .footer .ghost {
            color: #d1215b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Image -->
        <img src="logo.jpg" alt="Profile" class="profile-img">
        
        <div class="name">BADSHAH BHAIYA</div>
        
        <a href="https://t.me/+rLyM96rdI1QwNDg1" class="join-btn" id="joinButton">
            🚀 Join Free Telegram
        </a>
        
        <div class="countdown-container">
            <div class="timer" id="timerDisplay">00 : 00 : 00 : 15</div>
            <div class="labels" id="timerLabels">DAYS HOURS MINUTES SECONDS</div>
        </div>
        
        <div class="footer">
            Ads managed by <span class="ghost">GHOST</span>
        </div>
    </div>

    <script>
        // Track valid user subscriptions
        function trackSubscribe() {
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Subscribe');
            }
        }

        let timeLeft = 15;
        const timerElement = document.getElementById('timerDisplay');
        const labelsElement = document.getElementById('timerLabels');
        const telegramLink = "https://t.me/+rLyM96rdI1QwNDg1";
        
        let isHuman = false;
        let timerStarted = false;

        // Manual button click tracking
        document.getElementById('joinButton').addEventListener('click', function() {
            trackSubscribe();
        });

        // 15-second countdown & redirect
        function startCountdown() {
            if (timerStarted) return;
            timerStarted = true;

            const interval = setInterval(() => {
                timeLeft--;
                
                let displaySeconds = timeLeft < 10 ? "0" + timeLeft : timeLeft;
                timerElement.innerText = `00 : 00 : 00 : ${displaySeconds}`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    
                    // Show "JOIN FAST" and hide labels
                    timerElement.innerText = "JOIN FAST";
                    timerElement.style.letterSpacing = "2px"; 
                    labelsElement.style.display = "none";
                    
                    // Fire Pixel ONLY if user is human
                    if (isHuman) {
                        trackSubscribe();
                    }
                    
                    // Small delay to let user read "JOIN FAST"
                    setTimeout(() => {
                        window.location.href = telegramLink;
                    }, 1000); 
                }
            }, 1000);
        }

        // Anti-bot detection
        function markHumanActivity() {
            isHuman = true;
            startCountdown();
            
            // Remove listeners after first activity
            window.removeEventListener('touchstart', markHumanActivity);
            window.removeEventListener('mousemove', markHumanActivity);
            window.removeEventListener('scroll', markHumanActivity);
            window.removeEventListener('click', markHumanActivity);
        }

        // Listen for human interactions
        window.addEventListener('touchstart', markHumanActivity);
        window.addEventListener('mousemove', markHumanActivity);
        window.addEventListener('scroll', markHumanActivity);
        window.addEventListener('click', markHumanActivity);

        // Fallback timer (Bots ke case mein bina track kiye redirect karne ke liye)
        setTimeout(() => {
            if (!timerStarted) {
                startCountdown();
            }
        }, 2000);

    </script>
</body>
</html>
